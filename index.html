<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>3D 태양계</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
  canvas { display: block; }
  #info {
    position: absolute; top: 12px; left: 12px;
    color: #fff; font-size: 13px; opacity: 0.85;
    background: rgba(0,0,0,0.55); padding: 10px 14px; border-radius: 8px;
    pointer-events: none; line-height: 1.6; z-index: 10;
  }
  #time-display { color: #ffcc33; font-weight: bold; }
  #tex-status {
    position: absolute; bottom: 12px; left: 12px;
    color: #fff; font-size: 13px; background: rgba(0,0,0,0.85);
    padding: 15px; border-radius: 6px; max-width: 600px;
    line-height: 1.5; pointer-events: auto; max-height: 300px; overflow-y: auto;
    border: 2px solid #ffcc33; z-index: 10;
  }
  #tex-status .ok { color: #6f6; }
  #tex-status .fail { color: #f66; }
  #tex-status .file { color: #88ccff; }
  #controls {
    position: absolute; top: 12px; right: 12px;
    background: rgba(0,0,0,0.65); padding: 12px 16px; border-radius: 10px;
    color: #fff; font-size: 13px; width: 240px; z-index: 10;
  }
  #controls label { display: block; margin-bottom: 8px; cursor: pointer; }
  #controls input[type="checkbox"] { vertical-align: middle; margin-right: 6px; }
  #controls .time-section { border-top: 1px solid rgba(255,255,255,0.15); margin-top: 10px; padding-top: 10px; }
  #controls input[type="datetime-local"] {
    width: 100%; box-sizing: border-box; margin-bottom: 8px;
    background: #222; color: #fff; border: 1px solid #555;
    border-radius: 4px; padding: 4px 6px; font-size: 12px;
  }
  #controls button {
    width: 100%; padding: 6px; cursor: pointer;
    background: #333; color: #fff; border: 1px solid #555;
    border-radius: 4px; font-size: 12px; margin-bottom: 6px;
  }
  #controls button:hover { background: #444; }
  #speed-row { display: flex; gap: 6px; margin-top: 6px; }
  #speed-row button { flex: 1; font-size: 11px; padding: 4px 0; }
</style>
</head>
<body>
<div id="info">
  <div>시뮬레이션 시간 (베이징): <span id="time-display">--</span></div>
</div>
<div id="tex-status">서버 정보를 불러오는 중...</div>
<div id="controls">
  <label><input type="checkbox" id="toggleOrbits" checked> 궤도선</label>
  <label><input type="checkbox" id="toggleLabels" checked> 이름</label>
  <label><input type="checkbox" id="toggleMoonOrbit" checked> 달 궤도</label>
  <div class="time-section">
    <div style="margin-bottom:6px;font-weight:bold;">시간 조정</div>
    <input type="datetime-local" id="timeInput" step="1">
    <button id="applyTime">이 시간 적용</button>
    <button id="resetTime">현재 시간으로 리셋</button>
    <div style="margin-top:10px;font-weight:bold;">시간 속도</div>
    <div id="speed-row">
      <button data-speed="0">일시정지</button>
      <button data-speed="1">1x</button>
      <button data-speed="86400">1일/초</button>
      <button data-speed="2592000">1달/초</button>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ========== 0. 상태 표시 ==========
const statusEl = document.getElementById('tex-status');
const texLog = [];
function logTex(name, ok, detail) {
  texLog.push({ name, ok, detail });
  renderStatus();
}
function renderStatus() {
  const okCount = texLog.filter(t => t.ok).length;
  const failCount = texLog.length - okCount;
  const lines = texLog.map(t =>
    `<span class="${t.ok ? 'ok' : 'fail'}">${t.ok ? '✓' : '✗'}</span> ${t.name} <span style="opacity:0.6">${t.detail || ''}</span>`
  );
  statusEl.innerHTML = `상태: ${okCount}개 성공 / ${failCount}개 실패<br><hr style="border-color:#444">` + lines.join('<br>');
}

// ========== 1. 기본 씬 ==========
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 12000);
camera.position.set(0, 280, 500);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
document.body.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 50;
controls.maxDistance = 3000;

scene.add(new THREE.AmbientLight(0x555555, 1.5));
const sunLight = new THREE.PointLight(0xffffff, 2.5, 0, 0.4);
scene.add(sunLight);

// ========== 2. 별 배경 ==========
(function starfield() {
  const geo = new THREE.BufferGeometry();
  const count = 8000;
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 3000 + Math.random() * 2000;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i*3] = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = r * Math.cos(phi);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.2, sizeAttenuation: true })));
})();

// ========== 3. 텍스처 로더 ==========
const texLoader = new THREE.TextureLoader();
texLoader.crossOrigin = 'anonymous';

async function fetchDirectoryListing(url) {
  try {
    const res = await fetch(url);
    if (!res.ok) return [];
    const html = await res.text();
    const matches = [...html.matchAll(/href="([^"]+)"/g)];
    return matches.map(m => decodeURIComponent(m[1])).filter(f => !f.startsWith('?') && !f.startsWith('/') && f !== '../');
  } catch (e) {
    return [];
  }
}

// 기존 코드
const currentPath = window.location.pathname.endsWith('/') ? window.location.pathname : window.location.pathname + '/';
const texDir = currentPath + 'textures/';

// 수정할 코드 (그냥 무조건 현재 주소 기준 상대경로로 찾게 만듭니다)
const texDir = './textures/';
  
  const files = await fetchDirectoryListing(texDir);
  
  if (files.length > 0) {
    logTex('폴더 탐색', true, `'${texDir}' 에서 ${files.length}개 파일 발견`);
    // 발견된 파일 목록을 화면에 다 나열합니다.
    statusEl.innerHTML += `<br><b>발견된 파일 목록:</b><br>` + files.map(f => `<span class="file">- ${f}</span>`).join('<br>') + '<br><hr style="border-color:#444">';
  } else {
    logTex('폴더 탐색', false, `'${texDir}' 에 파일이 없거나 접근 불가`);
  }
  return { dir: texDir, files };
}

function findFile(files, targetBase) {
  if (!files || files.length === 0) return null;
  const target = targetBase.toLowerCase();
  return files.find(f => f.toLowerCase().includes(target));
}

let textureInfo = null;

async function loadTextureRobust(targetBase, onLoaded) {
  if (!textureInfo) return;
  const filename = findFile(textureInfo.files, targetBase);
  
  if (filename) {
    const url = textureInfo.dir + filename;
    try {
      const tex = await new Promise((resolve, reject) => {
        texLoader.load(url,
          (t) => { t.colorSpace = THREE.SRGBColorSpace; resolve(t); },
          undefined,
          () => reject(new Error('load fail'))
        );
      });
      logTex(targetBase, true, `→ ${filename}`);
      if (onLoaded) onLoaded(tex);
      return tex;
    } catch (e) {
      logTex(targetBase, false, `로드 에러 (${url})`);
      return null;
    }
  } else {
    logTex(targetBase, false, '해당 이름의 파일을 찾을 수 없음');
    return null;
  }
}

// ========== 4. 태양 ==========
const SUN_RADIUS = 12;
const sunMat = new THREE.MeshStandardMaterial({
  color: 0xffaa00, emissive: 0xffaa00, emissiveIntensity: 0.8,
});
const sun = new THREE.Mesh(new THREE.SphereGeometry(SUN_RADIUS, 64, 64), sunMat);
scene.add(sun);

const glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,'rgba(255,220,120,1)');
  g.addColorStop(0.4,'rgba(255,160,60,0.35)');
  g.addColorStop(1,'rgba(255,120,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
})();
const glow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true
}));
glow.scale.set(90, 90, 1);
sun.add(glow);

// ========== 5. 행성 궤도 요소 ==========
const planetsData = [
  { name:'수성', texture:'mercury', fallback:0xb0a99f, size:1.2,
    a:0.38709927, e:0.20563593, I:7.00497902, L:252.25032350, w_bar:77.45779628, Omega:48.33076593,
    ra:0.00000037, re:0.00001906, rI:-0.00594749, rL:149472.67411175, rw:0.16047689, rO:-0.12534081 },
  { name:'금성', texture:'venus', fallback:0xe6c27a, size:2.0,
    a:0.72333566, e:0.00677672, I:3.39467605, L:181.97909950, w_bar:131.60246718, Omega:76.67984255,
    ra:0.00000390, re:-0.00004107, rI:-0.00078890, rL:58517.81538729, rw:0.00268329, rO:-0.27769418 },
  { name:'지구', texture:'earth', fallback:0x4a90d9, size:2.2,
    a:1.00000261, e:0.01671123, I:-0.00001531, L:100.46457166, w_bar:102.93768193, Omega:0.0,
    ra:0.00000562, re:-0.00004392, rI:-0.01294668, rL:35999.37244981, rw:0.32327364, rO:0.0 },
  { name:'화성', texture:'mars', fallback:0xc1440e, size:1.7,
    a:1.52371034, e:0.09339410, I:1.84969142, L:-4.55343205, w_bar:-23.94362959, Omega:49.55953891,
    ra:0.00001847, re:0.00007882, rI:-0.00813131, rL:19140.30268499, rw:0.44441088, rO:-0.29257343 },
  { name:'목성', texture:'jupiter', fallback:0xd8ca9d, size:6.5,
    a:5.20288700, e:0.04838624, I:1.30439695, L:34.39644051, w_bar:14.72847983, Omega:100.47390909,
    ra:-0.00011607, re:-0.00013253, rI:-0.00183714, rL:3034.74612775, rw:0.21252668, rO:0.20469106 },
  { name:'토성', texture:'saturn', fallback:0xe3d9a0, size:5.5, ring:true,
    a:9.53667594, e:0.05386179, I:2.48599187, L:49.95424423, w_bar:92.59887831, Omega:113.66242448,
    ra:-0.00125060, re:-0.00050991, rI:0.00193609, rL:1222.49362201, rw:-0.41897216, rO:-0.28867794 },
  { name:'천왕성', texture:'uranus', fallback:0xa8d8e8, size:3.5,
    a:19.18916464, e:0.04725744, I:0.77263783, L:313.23810451, w_bar:170.95427630, Omega:74.01692503,
    ra:-0.00196176, re:-0.00004397, rI:-0.00242939, rL:428.48202785, rw:0.40805281, rO:0.04240589 },
  { name:'해왕성', texture:'neptune', fallback:0x3f54ba, size:3.4,
    a:30.06992276, e:0.00859048, I:1.77004347, L:-55.12002969, w_bar:44.96476227, Omega:131.78422574,
    ra:0.00026291, re:0.00005105, rI:0.00035372, rL:218.45945325, rw:-0.32241464, rO:-0.00508664 },
];

// ========== 6. 궤도 거리 압축 ==========
const ORBIT_SCALE = 32;
function auToScene(au) { return Math.sqrt(au) * ORBIT_SCALE; }

// ========== 7. 시간 계산 ==========
function getBeijingDate() {
  return new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Shanghai' }));
}
let simDate = getBeijingDate();
let timeScale = 1;

function getJulianCentury(date) {
  const jd = date.getTime() / 86400000 + 2440587.5;
  return (jd - 2451545.0) / 36525.0;
}

function computePlanetPosition(p, T) {
  const a = p.a + p.ra * T;
  const e = p.e + p.re * T;
  const I = THREE.MathUtils.degToRad(p.I + p.rI * T);
  const L = p.L + p.rL * T;
  const w_bar = p.w_bar + p.rw * T;
  const Omega = p.Omega + p.rO * T;
  const w = w_bar - Omega;
  let M = L - w_bar;
  M = ((M % 360) + 540) % 360 - 180;
  const Mrad = THREE.MathUtils.degToRad(M);
  let E = Mrad;
  for (let i = 0; i < 10; i++) {
    const dE = (E - e * Math.sin(E) - Mrad) / (1 - e * Math.cos(E));
    E -= dE;
    if (Math.abs(dE) < 1e-8) break;
  }
  const xp = a * (Math.cos(E) - e);
  const yp = a * Math.sqrt(1 - e * e) * Math.sin(E);
  const cosw = Math.cos(THREE.MathUtils.degToRad(w));
  const sinw = Math.sin(THREE.MathUtils.degToRad(w));
  const cosO = Math.cos(THREE.MathUtils.degToRad(Omega));
  const sinO = Math.sin(THREE.MathUtils.degToRad(Omega));
  const cosI = Math.cos(I);
  const sinI = Math.sin(I);
  const x = (cosw*cosO - sinw*sinO*cosI)*xp + (-sinw*cosO - cosw*sinO*cosI)*yp;
  const y = (cosw*sinO + sinw*cosO*cosI)*xp + (-sinw*sinO + cosw*cosO*cosI)*yp;
  const z = (sinw*sinI)*xp + (cosw*sinI)*yp;
  return { x, y, z };
}

function auVecToScene(x, y, z) {
  const distAU = Math.sqrt(x*x + y*y + z*z);
  const scale = distAU > 0 ? auToScene(distAU) / distAU : 0;
  return new THREE.Vector3(x * scale, z * scale, y * scale);
}

// ========== 8. 메인 초기화 ==========
async function init() {
  textureInfo = await autoDetectTextures();

  // 태양 텍스처
  loadTextureRobust('sun', (tex) => {
    sunMat.map = tex; sunMat.color.set(0xffffff); sunMat.emissiveMap = tex; sunMat.needsUpdate = true;
  });

  const planets = [];
  const orbitLines = [];
  const labelObjects = [];

  planetsData.forEach(data => {
    const mat = new THREE.MeshStandardMaterial({ color: data.fallback, roughness: 0.85, metalness: 0.02 });
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(data.size, 48, 48), mat);
    scene.add(mesh);

    loadTextureRobust(data.texture, (tex) => {
      mat.map = tex; mat.color.set(0xffffff); mat.needsUpdate = true;
    });

    if (data.ring) {
      const ringMat = new THREE.MeshBasicMaterial({ color: 0xd8cca0, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
      const ring = new THREE.Mesh(new THREE.RingGeometry(data.size * 1.4, data.size * 2.3, 64), ringMat);
      ring.rotation.x = Math.PI / 2 - 0.35;
      mesh.add(ring);
      loadTextureRobust('saturn_ring', (tex) => {
        ringMat.map = tex; ringMat.color.set(0xffffff); ringMat.alphaTest = 0.05; ringMat.needsUpdate = true;
      });
    }

    const div = document.createElement('div');
    div.textContent = data.name;
    div.style.cssText = 'color:#fff;font-size:11px;text-shadow:0 0 4px #000;opacity:0.9;padding:1px 3px;';
    const label = new CSS2DObject(div);
    label.position.set(0, data.size + 3.5, 0);
    mesh.add(label);
    labelObjects.push(label);

    const pts = [];
    for (let i = 0; i <= 256; i++) {
      const angle = (i / 256) * Math.PI * 2;
      const T = 0.25;
      const a = data.a + data.ra * T;
      const e = data.e + data.re * T;
      const I = THREE.MathUtils.degToRad(data.I + data.rI * T);
      const w_bar = data.w_bar + data.rw * T;
      const Omega = data.Omega + data.rO * T;
      const w = w_bar - Omega;
      const E = angle;
      const xp = a * (Math.cos(E) - e);
      const yp = a * Math.sqrt(1 - e*e) * Math.sin(E);
      const cosw = Math.cos(THREE.MathUtils.degToRad(w));
      const sinw = Math.sin(THREE.MathUtils.degToRad(w));
      const cosO = Math.cos(THREE.MathUtils.degToRad(Omega));
      const sinO = Math.sin(THREE.MathUtils.degToRad(Omega));
      const cosI = Math.cos(I);
      const sinI = Math.sin(I);
      const x = (cosw*cosO - sinw*sinO*cosI)*xp + (-sinw*cosO - cosw*sinO*cosI)*yp;
      const y = (cosw*sinO + sinw*cosO*cosI)*xp + (-sinw*sinO + cosw*cosO*cosI)*yp;
      const z = (sinw*sinI)*xp + (cosw*sinI)*yp;
      pts.push(auVecToScene(x, y, z));
    }
    const orbitLine = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.12 })
    );
    scene.add(orbitLine);
    orbitLines.push(orbitLine);

    planets.push({ data, mesh, label });
  });

  // 달
  const moonMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.7, 32, 32),
    new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.95 })
  );
  scene.add(moonMesh);
  loadTextureRobust('moon', (tex) => {
    moonMesh.material.map = tex; moonMesh.material.color.set(0xffffff); moonMesh.material.needsUpdate = true;
  });

  const moonDiv = document.createElement('div');
  moonDiv.textContent = '달';
  moonDiv.style.cssText = 'color:#ccc;font-size:9px;text-shadow:0 0 3px #000;opacity:0.8;';
  const moonLabel = new CSS2DObject(moonDiv);
  moonLabel.position.set(0, 1.4, 0);
  moonMesh.add(moonLabel);
  labelObjects.push(moonLabel);

  const moonOrbitRadius = 9;
  const moonOrbitPts = [];
  for (let i = 0; i <= 64; i++) {
    const a = (i / 64) * Math.PI * 2;
    moonOrbitPts.push(new THREE.Vector3(Math.cos(a) * moonOrbitRadius, 0, Math.sin(a) * moonOrbitRadius));
  }
  const moonOrbitLine = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(moonOrbitPts),
    new THREE.LineBasicMaterial({ color: 0x888888, transparent: true, opacity: 0.25 })
  );
  scene.add(moonOrbitLine);

  // 위치 업데이트
  const earthPos = new THREE.Vector3();
  function updatePositions() {
    const now = simDate;
    document.getElementById('time-display').textContent = now.toLocaleString('ko-KR', {
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    });
    const T = getJulianCentury(now);
    planets.forEach(p => {
      const pos = computePlanetPosition(p.data, T);
      p.mesh.position.copy(auVecToScene(pos.x, pos.y, pos.z));
      if (p.data.name === '지구') earthPos.copy(p.mesh.position);
    });
    const jd = now.getTime() / 86400000 + 2440587.5;
    const daysSinceJ2000 = jd - 2451545.0;
    const moonAngle = (daysSinceJ2000 / 27.32166) * Math.PI * 2;
    const moonTilt = THREE.MathUtils.degToRad(5.14);
    moonMesh.position.set(
      earthPos.x + Math.cos(moonAngle) * moonOrbitRadius,
      earthPos.y + Math.sin(moonAngle) * moonOrbitRadius * Math.sin(moonTilt),
      earthPos.z + Math.sin(moonAngle) * moonOrbitRadius
    );
    moonOrbitLine.position.copy(earthPos);
    moonOrbitLine.rotation.x = moonTilt;
  }

  // UI 이벤트
  const timeInput = document.getElementById('timeInput');
  function syncTimeInput() {
    const d = simDate;
    const pad = n => String(n).padStart(2, '0');
    timeInput.value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  document.getElementById('applyTime').addEventListener('click', () => {
    const val = timeInput.value;
    if (!val) return;
    const [datePart, timePart] = val.split('T');
    const [y, mo, d] = datePart.split('-').map(Number);
    const [h, mi, s] = timePart.split(':').map(Number);
    simDate = new Date(Date.UTC(y, mo-1, d, h-8, mi, s || 0));
    updatePositions();
  });
  document.getElementById('resetTime').addEventListener('click', () => {
    simDate = getBeijingDate();
    updatePositions();
    syncTimeInput();
  });
  document.querySelectorAll('#speed-row button').forEach(btn => {
    btn.addEventListener('click', () => {
      timeScale = Number(btn.dataset.speed);
      document.querySelectorAll('#speed-row button').forEach(b => b.style.background = '#333');
      btn.style.background = '#555';
    });
  });
  document.querySelector('#speed-row button[data-speed="1"]').style.background = '#555';

  document.getElementById('toggleOrbits').addEventListener('change', e => {
    orbitLines.forEach(l => l.visible = e.target.checked);
  });
  document.getElementById('toggleLabels').addEventListener('change', e => {
    labelObjects.forEach(l => l.visible = e.target.checked);
  });
  document.getElementById('toggleMoonOrbit').addEventListener('change', e => {
    moonOrbitLine.visible = e.target.checked;
  });

  syncTimeInput();
  updatePositions();

  // 애니메이션 루프
  let uiAccum = 0;
  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    if (timeScale > 0) {
      simDate = new Date(simDate.getTime() + dt * 1000 * timeScale);
      updatePositions();
      uiAccum += dt;
      if (uiAccum >= 0.5) { syncTimeInput(); uiAccum = 0; }
    }
    sun.rotation.y += dt * 0.05;
    planets.forEach(p => { p.mesh.rotation.y += dt * 0.15; });
    moonMesh.rotation.y += dt * 0.05;
    controls.update();
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
  }
  animate();
}

init();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerHeight, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
